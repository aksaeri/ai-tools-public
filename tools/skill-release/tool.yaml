title: skill-release
order: 3
summary: Checks a skill before you share it, then exports a cleaned copy one way into a public repo. Your private patterns stay outside it.
how_i_use_it: |
  This site is built with it. I keep developing my skills where they live. When I want to share one, Claude runs the check, fixes or rewrites anything private in the public copy, and commits it here. I read the diff before anything is pushed.
endorsement: New in October 2026. I use it for every tool on this site.
