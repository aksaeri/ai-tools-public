title: skill-release
header: demo/header.svg
order: 3
summary: Checks a skill you want to share for private details, like machine names or your email, then copies a cleaned version into a public repo.
how_i_use_it: |
  I wanted to publish skills I'd built privately, which were full of my own setup and private details. This skill cleans a skill up and gets it ready to publish. I read the changes before anything goes public.
media: []
brief: demo/skill-release-brief.md
surfaces:
  cowork:
    reasons:
    - needs uv installed inside Cowork's virtual machine
    - sees only the folders you connect, so connect your skill sources, your public repo and your settings folder
requires:
- A public git repository you can push to, such as one on GitHub
