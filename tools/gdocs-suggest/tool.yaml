title: gdocs-suggest
order: 1
summary: Claude comments on, copyedits and fills gaps in a Google Doc, with every word it adds in red or marked [Claude].
how_i_use_it: |
  When a draft needs a copyedit or a review, I ask Claude to mark it up in the Doc itself. Rewrites and filled-in {TBC} markers appear in red under my original, so I can compare line by line and keep what I want. Small fixes come as normal suggestions I can accept or reject, and questions come as comments starting [Claude]. A week later I can still tell which sentences are mine.
endorsement: I use this on most drafts I share with colleagues. Endorsed.
media:
