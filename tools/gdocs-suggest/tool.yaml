title: gdocs-suggest
header: demo/header.svg
order: 1
summary: Claude comments on, copyedits and fills gaps in a Google Doc. Everything it adds is red or marked [Claude].
how_i_use_it: |
  I ask Claude to review a draft in the Doc itself, not in chat. It marks its work in three ways:

  - rewrites and filled-in {TBC} markers go in red under my original
  - small fixes come as suggestions I accept or reject
  - questions come as comments starting [Claude]
endorsement: I use this on most drafts before colleagues see them.
media:
- image: demo/before.png
  caption: A made-up workshop summary, before Claude's review.
- image: demo/after.png
  caption: 'After one run: suggested fixes inline, and a filled-in placeholder and a rewrite in red under the originals.'
brief: demo/gdocs-suggest-brief.md
