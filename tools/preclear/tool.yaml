title: preclear
header: demo/header.svg
order: 6
summary: Before you clear a Claude Code session, Claude saves what's still open to a file, and the next session starts by reading it.
how_i_use_it: |
  Before I clear a session, I say "preclear", and Claude writes down anything still open: replies I'm waiting on, checks due later, decisions I put off. The next session starts with that list.
surfaces:
  claude-ai:
    verdict: 'no'
    reasons:
    - Claude chat has no /clear and no session hooks, which this relies on
  cowork:
    verdict: caveat
    reasons:
    - not yet tested in Cowork, and it needs the session-start hook to read the file back
media: []
brief: demo/preclear-brief.md
