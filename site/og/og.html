<!doctype html>
<!-- Template for the sharing image. Render at 1200x630 and save as og-image.webp:
     the text stays inside the centre 630x630 square, so square crops keep it. -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #12131f url(og-art.webp) center / cover no-repeat; font-family: Inter, system-ui, sans-serif; color: #1A1A1A; }
  .safe { position: absolute; left: 285px; top: 0; width: 630px; height: 630px; box-sizing: border-box; padding: 64px 40px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 14px; }
  .box { background: #FFFFFF; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
  h1 { margin: 0; font-size: 92px; line-height: 1; font-weight: 700; letter-spacing: -0.03em; padding: 20px 30px 24px; }
  p { margin: 0; font-size: 30px; line-height: 1.35; padding: 18px 24px; max-width: 520px; }
  .url { font-size: 24px; font-weight: 600; color: #0F5C6B; padding: 10px 18px; }
</style></head>
<body><div class="safe">
  <h1 class="box">AI tools</h1>
  <div class="box url">tools.aksaeri.com</div>
</div>
<script>
  // ?art=<file> picks the background, for trying versions; the default is og-art.webp.
  var a = new URLSearchParams(location.search).get("art");
  if (a && /^[\w.-]+\.webp$/.test(a)) document.body.style.backgroundImage = "url(" + a + ")";
</script>
</body></html>
