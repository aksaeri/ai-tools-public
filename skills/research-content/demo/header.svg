<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="A question goes out to four independent search agents (videos, forums, papers, other languages). Their finds come back as one numbered list of leads, and your reply sends the next round."><style>
.s-paper{fill:var(--surface,#fff);stroke:var(--line-strong,#C9CCC6);stroke-width:1.5}
.s-box{fill:var(--surface,#fff);stroke:var(--accent,#17879B);stroke-width:2}
.s-dash{fill:none;stroke:var(--muted,#6B6B6B);stroke-width:1.5;stroke-dasharray:5 4}
.s-ln{fill:var(--line-strong,#C9CCC6)}
.s-ink{fill:var(--fg,#1A1A1A)}
.s-red{fill:#E0352B}
.s-green{fill:#1E8E3E}
.s-teal{fill:var(--accent,#17879B)}
.s-tint{fill:var(--tint-2,rgba(23,135,155,.16))}
.s-ar{fill:none;stroke:var(--accent,#17879B);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.s-thin{fill:none;stroke:var(--muted,#6B6B6B);stroke-width:1.5}
.s-strike{stroke:var(--muted,#6B6B6B);stroke-width:1.5}
.s-lab{fill:var(--muted,#6B6B6B);font:500 15px Inter,system-ui,sans-serif}
.s-mono{fill:var(--muted,#6B6B6B);font:500 11px 'JetBrains Mono',ui-monospace,monospace}
.s-tag{fill:var(--accent,#17879B);font:600 10px Inter,system-ui,sans-serif}
</style><rect class="s-box" x="30" y="175" width="170" height="80" rx="12"/><rect class="s-ln" x="46" y="193" width="130" height="6" rx="3"/><rect class="s-ln" x="46" y="207" width="100" height="6" rx="3"/><rect class="s-ln" x="46" y="221" width="70" height="6" rx="3"/><text class="s-lab" x="115" y="285" text-anchor="middle">Your question</text><path class="s-ar" d="M205,215 L262,94"/><path class="s-ar" d="M262.1,104.0 L262,94 L254.2,100.3"/><rect class="s-paper" x="270" y="70" width="190" height="50" rx="8"/><path class="s-teal" d="M284,86 l14,8 l-14,8 z"/><text class="s-lab" x="314" y="100" style="font-size:13px">Videos</text><path class="s-ar" d="M465,94 L538,120"/><path class="s-ar" d="M528.1,121.1 L538,120 L531.0,112.9"/><path class="s-ar" d="M205,215 L262,176"/><path class="s-ar" d="M257.0,184.7 L262,176 L252.1,177.5"/><rect class="s-paper" x="270" y="152" width="190" height="50" rx="8"/><rect class="s-thin" x="284" y="168" width="18" height="13" rx="3"/><path class="s-thin" d="M288,181 l0,5 l5,-5"/><text class="s-lab" x="314" y="182" style="font-size:13px">Forums</text><path class="s-ar" d="M465,176 L538,170"/><path class="s-ar" d="M529.4,175.1 L538,170 L528.7,166.4"/><path class="s-ar" d="M205,215 L262,258"/><path class="s-ar" d="M252.2,256.0 L262,258 L257.4,249.1"/><rect class="s-paper" x="270" y="234" width="190" height="50" rx="8"/><rect class="s-thin" x="284" y="250" width="14" height="18" rx="2"/><text class="s-lab" x="314" y="264" style="font-size:13px">Papers</text><path class="s-ar" d="M465,258 L538,220"/><path class="s-ar" d="M532.0,228.0 L538,220 L528.0,220.3"/><path class="s-ar" d="M205,215 L262,340"/><path class="s-ar" d="M254.3,333.6 L262,340 L262.2,330.0"/><rect class="s-paper" x="270" y="316" width="190" height="50" rx="8"/><circle class="s-thin" cx="293" cy="341" r="9"/><path class="s-thin" d="M284,341 h18 M293,332 v18"/><text class="s-lab" x="314" y="346" style="font-size:13px">Other languages</text><path class="s-ar" d="M465,340 L538,270"/>