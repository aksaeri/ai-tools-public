<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="A request goes one of two ways: a video model films a short clip, or Claude builds an animated page timed to narration. Both end as an mp4 that Claude checks on a contact sheet."><style>
