title: generate-video
header: demo/header.svg
order: 9
summary: "Makes videos: short realistic clips from a video model, or narrated explainers and animations that Claude builds itself."
how_i_use_it: |
  I ask any session for a short clip, like a five-second video of something to share with friends, and get a file back without opening a web tool. When I want something explained, Claude builds the video itself, with a voice, music and animation it writes. The skill picks between the two by asking whether the video has to look real or has to explain.
media: []
brief: demo/generate-video-brief.md
requires:
- Node 22 or later, ffmpeg and Google Chrome
- A Gemini API key (GEMINI_API_KEY). OPENROUTER_API_KEY and GROQ_API_KEY are optional
- About 35 cents per 5-second clip, 8 cents for music and about 1.4 cents a minute of narration
- Tested on Linux only, not on Windows or macOS
art: demo/art.webp
