<!doctype html>
<!-- A starting point, not a style. Copy this folder, then design the look yourself.
     Length: data-duration in seconds, or leave it out and the video ends
     data-tail seconds after the narration does. -->
<html lang="en" data-width="1920" data-height="1080" data-fps="30" data-tail="1.5">
<head>
<meta charset="utf-8">
<title>Composition</title>
<link rel="stylesheet" href="stage.css">
<style>
  :root { --w: 1920px; --h: 1080px; --ink: #14171c; --paper: #f4f1ea; --accent: #c2410c; }
  body { background: var(--paper); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
  .scene { display: grid; place-content: center; padding: 120px 160px; gap: 36px; }
  h1 { margin: 0; font-size: 120px; line-height: 1.05; letter-spacing: -0.02em; text-wrap: balance; }
  p { margin: 0; font-size: 52px; line-height: 1.3; max-width: 24ch; }
  .accent { color: var(--accent); }
</style>
</head>
<body>

<section class="scene" data-from="0" data-to="n02">
  <h1 data-at="n01">One idea <span class="accent">per scene</span></h1>
  <p data-at="n01+1.2">Each thing arrives when the voice gets to it.</p>
</section>

<section class="scene" data-from="n02" data-to="end">
  <h1 data-at="n02+0.2">Then hold</h1>
  <p data-at="n02+1.4">Leave time to read before moving on.</p>
</section>

<div id="captions"></div>

<!-- narration.js is written by narrate.js; stage.js must come after it -->
<script src="audio/narration.js"></script>
<script src="stage.js"></script>
</body>
</html>
