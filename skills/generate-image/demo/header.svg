<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="A prompt goes to a Gemini image model, which returns a picture that Claude looks at before showing it."><style>
.s-paper{fill:var(--surface,#fff);stroke:var(--line-strong,#C9CCC6);stroke-width:1.5}
