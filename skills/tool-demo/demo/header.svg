<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="A tool you built is turned into a list of use cases, which become a page, a rebuild brief and one short video per use case."><style>
.s-paper{fill:var(--surface,#fff);stroke:var(--line-strong,#C9CCC6);stroke-width:1.5}
.s-box{fill:var(--surface,#fff);stroke:var(--accent,#17879B);stroke-width:2}
